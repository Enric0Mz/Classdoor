services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-classdoor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-classdoor}
      POSTGRES_DB: ${POSTGRES_DB:-classdoor}
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
